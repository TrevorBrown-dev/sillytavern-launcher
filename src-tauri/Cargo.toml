[package]
name = "stlauncher"
version = "0.1.0"
description = "One-click SillyTavern installer and launcher for Windows"
edition = "2021"
rust-version = "1.85"

[lib]
name = "stlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production mode: serve the embedded `dist/` instead of the Vite dev server.
# `tauri build` turns this on by itself; a bare `cargo build --release` must pass
# `--features custom-protocol` (tools/build.ps1 does).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
chrono = "0.4"
dirs = "7"
open = "5"
hex = "0.4"
sha2 = "0.11"
local-ip-address = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "json", "charset", "http2"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
